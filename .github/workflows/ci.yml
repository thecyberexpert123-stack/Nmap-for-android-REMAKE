name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit tests, coverage, lint (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pure-JVM modules (core, engine)
        run: >
          ./gradlew
          :core:check
          :engine:check
          :core:ktlintCheck
          :engine:ktlintCheck
          :core:detekt
          :engine:detekt
          --stacktrace
          2>&1 | tee /tmp/gradle-jvm.log

      - name: Verify Android app (assemble, lint, ktlint, detekt)
        run: >
          ./gradlew
          :app:assembleDebug
          :app:lintDebug
          :app:ktlintCheck
          :app:detekt
          --stacktrace
          2>&1 | tee /tmp/gradle-app.log

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**/*
            **/build/reports/jacoco/**/*.xml
            **/build/reports/detekt/**/*
          if-no-files-found: ignore

      - name: Report Gradle failure details
        if: failure()
        shell: bash
        run: |
          log=/tmp/gradle-app.log
          [ -f /tmp/gradle-jvm.log ] && log=/tmp/gradle-jvm.log
          python3 .github/scripts/post-failure-annotation.py "$log" "Gradle failure tail"

  emulator:
    name: Instrumentation tests on API ${{ matrix.api }}
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      checks: write
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace 2>&1 | tee /tmp/gradle-emu.log

      - name: Report emulator failure details
        if: failure()
        shell: bash
        run: |
          python3 .github/scripts/post-failure-annotation.py /tmp/gradle-emu.log "Emulator step failure tail (API ${{ matrix.api }})"
