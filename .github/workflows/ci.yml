name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit tests, coverage, lint (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify pure-JVM modules (core, engine)
        run: >
          ./gradlew
          :core:check
          :engine:check
          :core:ktlintCheck
          :engine:ktlintCheck
          :core:detekt
          :engine:detekt
          --stacktrace
          2>&1 | tee /tmp/gradle-jvm.log

      - name: Verify Android app (assemble, lint, ktlint, detekt)
        run: >
          ./gradlew
          :app:assembleDebug
          :app:lintDebug
          :app:ktlintCheck
          :app:detekt
          --stacktrace
          2>&1 | tee /tmp/gradle-app.log

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**/*
            **/build/reports/jacoco/**/*.xml
            **/build/reports/detekt/**/*
          if-no-files-found: ignore

      # Diagnostic relay: the development sandbox has no egress to the
      # Actions log-storage host, so on failure the Gradle tail is posted as
      # a check-run annotation (readable via api.github.com).
      - name: Report Gradle failure details
        if: failure()
        shell: bash
        run: |
          log=/tmp/gradle-app.log
          [ -f /tmp/gradle-jvm.log ] && log=/tmp/gradle-jvm.log
          python3 - "$log" <<'PYEOF'
          import json, os, sys, urllib.request
          path = sys.argv[1]
          tail = open(path, errors="replace").read()[-12000:]
          message = tail if tail.strip() else "(no gradle output captured)"
          annotation = {
              "path": path,
              "start_line": 1,
              "end_line": 1,
              "annotation_level": "failure",
              "message": message,
          }
          body = json.dumps({
              "name": "gradle-failure-details",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "failure",
              "output": {
                  "title": "Gradle failure tail",
                  "summary": "Tail of the failing Gradle step log.",
                  "annotations": [annotation],
              },
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=body,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print("check-run posted:", response.status)
          PYEOF

  emulator:
    name: Instrumentation tests on API ${{ matrix.api }}
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
