name: CI

on:
  push:
    # Every branch except the diagnostic evidence branches (pushed by this
    # workflow itself — letting those trigger runs would loop forever).
    branches-ignore: ['ci-evidence**', 'ci-probe']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit tests, coverage, lint (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Diagnostic probe (runs only when the triggering commit message
      # contains "[probe]"): can the workflow token push commits? That is
      # what the evidence relay below depends on.
      - name: Probe GITHUB_TOKEN write capabilities
        if: ${{ contains(github.event.head_commit.message, '[probe]') }}
        continue-on-error: true
        run: |
          echo "probe run=$GITHUB_RUN_ID sha=$GITHUB_SHA" > ci-probe.txt
          git add -f ci-probe.txt
          if git -c user.name="CI evidence bot" -c user.email="ci-evidence@arena.local" \
              commit -m "ci: token probe from run $GITHUB_RUN_ID [probe]"; then
            git push --force origin HEAD:ci-probe
          else
            echo "(nothing to commit)"
          fi

      # 'shell: bash' runs with -o pipefail so gradlew's exit code survives
      # the | tee (the default shell would report tee's status: always 0).
      - name: Verify pure-JVM modules (core, engine)
        shell: bash
        run: >
          ./gradlew
          :core:check
          :engine:check
          :core:ktlintCheck
          :engine:ktlintCheck
          :core:detekt
          :engine:detekt
          --stacktrace
          2>&1 | tee /tmp/gradle-jvm.log

      - name: Verify Android app (assemble, lint, ktlint, detekt)
        shell: bash
        run: >
          ./gradlew
          :app:assembleDebug
          :app:lintDebug
          :app:ktlintCheck
          :app:detekt
          --stacktrace
          2>&1 | tee /tmp/gradle-app.log

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**/*
            **/build/reports/jacoco/**/*.xml
            **/build/reports/detekt/**/*
          if-no-files-found: ignore

      # The sandbox cannot read Actions logs or artifacts (egress blocked),
      # so failure details are relayed by pushing them to a dedicated
      # never-merged branch that the sandbox can fetch.
      - name: Publish failure details to ci-evidence branch
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-evidence
          {
            echo "=== run $GITHUB_RUN_ID · job verify · sha $GITHUB_SHA ==="
            echo ""
            echo "--- gradle-jvm tail ---"
            tail -c 30000 /tmp/gradle-jvm.log 2>/dev/null || echo "(none)"
            echo ""
            echo "--- gradle-app tail ---"
            tail -c 30000 /tmp/gradle-app.log 2>/dev/null || echo "(none)"
          } > ci-evidence/evidence.txt
          git add -f ci-evidence
          if git -c user.name="CI evidence bot" -c user.email="ci-evidence@arena.local" \
              commit -m "ci: verify failure evidence run $GITHUB_RUN_ID [evidence]"; then
            git push --force origin HEAD:ci-evidence-verify
          else
            echo "(nothing to commit)"
          fi

  emulator:
    name: E2E app scan on API ${{ matrix.api }} emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Hardware-accelerated emulators on GitHub's Ubuntu runners (per the
      # android-emulator-runner README, this is now the recommended host).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Real, authorized scan targets for the app: the emulator reaches the
      # runner host as 10.0.2.2. 18080/18443 listen (OPEN), 18081/18082 do
      # not (CLOSED), and 18099 is silently dropped when iptables allows
      # (TIMEOUT) — nothing outside this job is touched.
      - name: Start authorized scan targets on the runner host
        run: |
          nohup python3 -m http.server 18080 --bind 127.0.0.1 >/tmp/target-18080.log 2>&1 &
          nohup python3 -m http.server 18443 --bind 127.0.0.1 >/tmp/target-18443.log 2>&1 &
          sleep 1
          curl -s -o /dev/null -w "listener 18080: %{http_code}\n" http://127.0.0.1:18080/ || true
          curl -s -o /dev/null -w "listener 18443: %{http_code}\n" http://127.0.0.1:18443/ || true
          if sudo iptables -A INPUT -p tcp --dport 18099 -j DROP 2>/dev/null; then
            echo "TIMEOUT_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "TIMEOUT_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Run the app on the emulator (E2E scan tests)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 1200
          # NOTE: this script is executed as ONE line with /bin/sh (dash),
          # so keep it single-line, pipe-free and bashism-free. gradlew logs
          # to a file first, then the status is captured BEFORE the cat so
          # a failed build cannot be masked by a successful cat.
          script: if [ "$TIMEOUT_ENABLED" = "true" ]; then ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.timeoutPortEnabled=true --stacktrace > /tmp/gradle-emu.log 2>&1; else ./gradlew :app:connectedDebugAndroidTest --stacktrace > /tmp/gradle-emu.log 2>&1; fi; status=$?; cat /tmp/gradle-emu.log; exit $status

      # The emulator is torn down after the runner step above, so adb can
      # hang against a stale server — bound every call with a timeout.
      - name: Capture scan evidence (logcat + screenshot)
        if: always()
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK/platform-tools:$PATH"
          timeout 45 adb logcat -d > /tmp/scan-logcat.log || true
          timeout 45 adb exec-out run-as org.nmapremake.app cat files/scan-results.png > /tmp/scan-results.png 2>/dev/null || true
          timeout 15 grep -E "ScanE2E|ScanReal|ScanTimeout" /tmp/scan-logcat.log > /tmp/scan-evidence.log \
            || echo "(no scan evidence in logcat)" > /tmp/scan-evidence.log

      - name: Upload scan evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-evidence-api-${{ matrix.api }}
          path: |
            /tmp/scan-logcat.log
            /tmp/scan-results.png
            /tmp/scan-evidence.log
          if-no-files-found: ignore

      # Relay for the sandbox: publish evidence to a dedicated never-merged
      # branch (the sandbox cannot read Actions logs or artifacts).
      - name: Publish scan evidence to ci-evidence branch
        if: always()
        shell: bash
        run: |
          mkdir -p ci-evidence
          {
            echo "=== run $GITHUB_RUN_ID · API ${{ matrix.api }} · sha $GITHUB_SHA ==="
            echo ""
            echo "--- scan evidence (logcat) ---"
            cat /tmp/scan-evidence.log 2>/dev/null || echo "(none)"
            echo ""
            echo "--- gradle tail ---"
            tail -c 30000 /tmp/gradle-emu.log 2>/dev/null || echo "(none)"
          } > ci-evidence/evidence.txt
          cp /tmp/scan-results.png ci-evidence/scan-results.png 2>/dev/null || true
          git add -f ci-evidence
          if git -c user.name="CI evidence bot" -c user.email="ci-evidence@arena.local" \
              commit -m "ci: scan evidence API ${{ matrix.api }} run $GITHUB_RUN_ID [evidence]"; then
            git push --force origin HEAD:ci-evidence-api${{ matrix.api }}
          else
            echo "(nothing to commit)"
          fi
