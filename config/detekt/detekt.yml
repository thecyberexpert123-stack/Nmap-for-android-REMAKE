build:
  maxIssues: 0

style:
  MagicNumber:
    active: false
  ForbiddenComment:
    active: false
  # The parsers (TargetParser/PortSpecParser/PlanInputParser) are written in
  # deliberate early-return style — one return per rejected input — which is
  # the clearest structure for a token parser and is unit-tested end to end.
  # The default limit (2) cannot express that style; the threshold matches
  # the largest parser function (9 returns).
  ReturnCount:
    max: 10

# FunctionNaming lives in the 'naming' ruleset (not 'style') in detekt 1.x.
naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
      - androidx.compose.runtime.Composable

complexity:
  LongParameterList:
    functionThreshold: 12
    constructorThreshold: 10
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: false
  LongMethod:
    threshold: 120
